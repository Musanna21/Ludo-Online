<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Multiplayer - Welcome</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #818cf8;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 1rem;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: #94a3b8;
            margin-top: 1rem;
            border: 1px solid #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
            color: white;
        }

        /* Simple Modal for Game Rules */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            text-align: left;
        }

        .modal-content h3 {
            margin-bottom: 1rem;
            color: #818cf8;
        }

        .modal-content ul {
            margin-left: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .modal-content li {
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        footer {
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid #334155;
        }
    </style>
</head>

<body>
    <header>
        <h1>🎲 LUDO LIVE</h1>
    </header>

    <main>
        <div class="login-card">
            <h2 style="margin-bottom: 1.5rem;">Enter the Arena</h2>

            <form id="guestForm" onsubmit="handleGuestLogin(event)">
                <div class="input-group">
                    <label for="playerName">Display Name</label>
                    <input type="text" id="playerName" placeholder="e.g. LudoMaster" required autocomplete="off">
                </div>

                <button type="submit" class="btn btn-primary">Play as Guest</button>
            </form>

            <button onclick="toggleModal(true)" class="btn btn-secondary">How to Play</button>
        </div>
    </main>

    <!-- How to Play Modal -->
    <div id="rulesModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Game Rules</h3>
            <ul>
                <li>Roll a <strong>6</strong> to move a token out of your base.</li>
                <li>Landing on an opponent's token sends them back to base.</li>
                <li>Star tiles are <strong>Safe Zones</strong> where tokens cannot be captured.</li>
                <li>First player to bring all 4 tokens home wins!</li>
            </ul>
            <button onclick="toggleModal(false)" class="btn btn-primary">Got It!</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Ludo Multiplayer Prototype</p>
    </footer>

    <script>
        // Save player name to localStorage so lobby.html and game.html can use it!
        function handleGuestLogin(event) {
            event.preventDefault();
            const playerName = document.getElementById('playerName').value.trim();

            if (playerName) {
                localStorage.setItem('ludo_player_name', playerName);
                // Redirect to the lobby file
                window.location.href = 'lobby.html';
            }
        }

        // Open/Close Rules Modal
        function toggleModal(show) {
            const modal = document.getElementById('rulesModal');
            modal.style.display = show ? 'flex' : 'none';
        }
    </script>
</body>

</html>
